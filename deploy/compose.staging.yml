# Staging stack — deployed by Foix Portainer (git-backed stack).
#
# Architecture (auth removed, staging is public but noindex):
#
#   NPM (TLS, staging-doc.vidocq.dev) ──► vidocq-docs-staging:8080 (Chappe)
#
# Same as the prod stack, but: tracks the mutable `snapshot` tag (rebuilt on every
# push to main), short cache, and asks crawlers not to index it. No oauth2-proxy,
# no OIDC — staging is public, just unlisted.
#
# Environment variables (Portainer UI -> Stack -> Environment variables):
#   TAG             image tag (default: snapshot — what the CI pushes from main)
#
# The container name is fixed to `vidocq-docs-staging`: NPM's proxy host for
# staging-doc.vidocq.dev forwards to vidocq-docs-staging:8080 (Docker DNS on the
# reverseproxy network resolves the container by this name).

services:

  vidocq-docs:
    image: registry.vidocq.dev/vidocq-docs:${TAG:-snapshot}
    container_name: vidocq-docs-staging
    restart: unless-stopped
    # `snapshot` is mutable (rewritten on every push to main). Without
    # `pull_policy: always`, a redeploy would recreate the container on the cached
    # digest; with `always`, each (re)creation forces `docker pull`.
    pull_policy: always
    environment:
      CHAPPE_DOCROOT: /var/www/vidocq-docs
      CHAPPE_PORT: "8080"
      CHAPPE_BIND: "0.0.0.0"
      CHAPPE_CACHE: "max-age=300, public"   # short cache on staging
      STAGING: "true"                         # X-Robots-Tag: noindex, nofollow
    networks:
      - reverseproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      io.vidocq.environment: staging
      io.vidocq.component: docs

networks:
  # NPM's existing network — forward staging-doc.vidocq.dev to vidocq-docs-staging:8080.
  reverseproxy:
    external: true
    name: reverseproxy_default
