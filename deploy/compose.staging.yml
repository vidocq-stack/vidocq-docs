# Stack staging — déployée par Portainer (Stack-from-Git).
#
# Architecture :
#
#   NPM (TLS) ──► oauth2-proxy:4180 ──► vidocq-docs-staging:8080 (Chappe)
#       (staging-doc.vidocq.dev)        ▲                ▲
#                                       │                │
#                                       └─ OIDC dance ───┘
#                                          forge.vidocq.dev
#
# Le service `vidocq-docs` est sur le réseau `internal` uniquement, il n'est
# joignable que par `oauth2-proxy`. NPM voit `oauth2-proxy` sur le réseau
# `reverseproxy_default`.
#
# Variables d'env consommées (à régler dans Portainer UI → Stack → Environment
# variables) :
#   IMAGE_TAG           tag de l'image (défaut : snapshot)
#   CONTAINER_NAME      nom du container Chappe (défaut : vidocq-docs-staging) ;
#                       le sidecar OIDC s'appelle ${CONTAINER_NAME}-oauth.
#   OIDC_CLIENT_ID      Client ID de l'app OAuth2 Forgejo (vidocq-docs-staging)
#   OIDC_CLIENT_SECRET  Client Secret de la même app
#   OIDC_COOKIE_SECRET  32 bytes base64 (`openssl rand -base64 32`)

services:

  vidocq-docs:
    image: forge.vidocq.dev/vidocq/vidocq-docs:${IMAGE_TAG:-snapshot}
    container_name: ${CONTAINER_NAME:-vidocq-docs-staging}
    restart: unless-stopped
    # IMAGE_TAG est mutable (`snapshot` réécrit à chaque push main) ; sans
    # `pull_policy: always`, Portainer/Docker garde l'image en cache local et
    # le webhook re-crée le container sur l'ancienne digest. Avec `always`,
    # chaque (re)création force `docker pull` → on récupère bien la nouvelle
    # image publiée par la CI Forgejo.
    pull_policy: always
    environment:
      CHAPPE_DOCROOT: /var/www/vidocq-docs
      CHAPPE_PORT: "8080"
      CHAPPE_BIND: "0.0.0.0"
      CHAPPE_CACHE: "max-age=300, public"   # cache court en staging
      STAGING: "true"                         # X-Robots-Tag: noindex, nofollow (à terme)
    networks:
      - internal                              # ← uniquement joignable par oauth2-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      io.vidocq.environment: staging
      io.vidocq.component: docs

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: ${CONTAINER_NAME:-vidocq-docs-staging}-oauth
    restart: unless-stopped
    depends_on:
      vidocq-docs:
        condition: service_healthy
    environment:
      # ─── Provider OIDC = Forgejo ───
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://forge.vidocq.dev
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      OAUTH2_PROXY_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:?OIDC_COOKIE_SECRET is required}
      # ─── Endpoints ───
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: https://staging-doc.vidocq.dev/oauth2/callback
      OAUTH2_PROXY_REDIRECT_URL_FORCE_HTTPS: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"      # NPM est en amont
      OAUTH2_PROXY_UPSTREAMS: http://${CONTAINER_NAME:-vidocq-docs-staging}:8080/
      # ─── ACL : tout user loggé sur Forgejo ───
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # ─── Cookie partagé sur *.vidocq.dev (staging ↔ prod) ───
      OAUTH2_PROXY_COOKIE_DOMAINS: .vidocq.dev
      OAUTH2_PROXY_WHITELIST_DOMAINS: .vidocq.dev
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      # ─── Headers passés au backend ───
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      # ─── Health (NPM peut sonder /ping sans auth) ───
      OAUTH2_PROXY_PING_PATH: /ping
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "GET=^/healthz$$"
    networks:
      - reverseproxy                          # ← exposé à NPM
      - internal                              # ← parle à vidocq-docs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4180/ping"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      io.vidocq.environment: staging
      io.vidocq.component: oauth2-proxy

networks:
  reverseproxy:
    external: true
    name: reverseproxy_default
  internal:
    driver: bridge
