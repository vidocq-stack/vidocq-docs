# Production stack — deployed by Foix Portainer (git-backed stack).
#
# Architecture (auth removed, docs are fully public):
#
#   NPM (TLS, doc.vidocq.dev) ──► vidocq-docs:8080 (Chappe)
#
# Chappe is exposed directly on the `npm` external network so Nginx Proxy
# Manager can reach it. No oauth2-proxy, no OIDC.
#
# Environment variables (set in Portainer UI -> Stack -> Environment variables):
#   TAG             image tag (default: latest — what the CI pushes on v* release tags;
#                   pin it to a specific version, e.g. 0.1.0, to freeze the prod docs)
#   CONTAINER_NAME  Chappe container name (default: vidocq-docs)

services:

  vidocq-docs:
    image: registry.vidocq.dev/vidocq-docs:${TAG:-latest}
    container_name: ${CONTAINER_NAME:-vidocq-docs}
    restart: unless-stopped
    # The tags we publish are mutable (`snapshot`, `latest`). Without
    # `pull_policy: always`, Portainer/Docker keeps the cached image and a
    # redeploy recreates the container on the old digest. With `always`, each
    # (re)creation forces `docker pull` so we get the freshly published image.
    pull_policy: always
    environment:
      CHAPPE_DOCROOT: /var/www/vidocq-docs
      CHAPPE_PORT: "8080"
      CHAPPE_BIND: "0.0.0.0"
      CHAPPE_CACHE: "max-age=3600, public"  # long cache in prod
    networks:
      - npm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      io.vidocq.environment: production
      io.vidocq.component: docs

networks:
  npm:
    external: true
