# Stack production — déployée par Portainer (Stack-from-Git).
#
# Hostname public attendu : doc.vidocq.dev
# Reverse-proxy : Nginx Proxy Manager (hors-stack), connecté au même
#   réseau `reverseproxy_default`. Le container n'expose AUCUN port sur l'hôte.
#
# Variables d'env consommées (cf. deploy/.env.example) :
#   IMAGE_TAG      tag de l'image (défaut : latest — typiquement un v0.x.y release)
#   CONTAINER_NAME nom DNS interne, doit matcher le forward configuré dans NPM
#                  (défaut : vidocq-docs-prod)

services:
  vidocq-docs:
    image: forge.vidocq.dev/vidocq/vidocq-docs:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-vidocq-docs-prod}
    restart: unless-stopped
    environment:
      CHAPPE_DOCROOT: /var/www/vidocq-docs
      CHAPPE_PORT: "8080"
      CHAPPE_BIND: "0.0.0.0"
      CHAPPE_CACHE: "max-age=3600, public"  # cache long en prod
      STAGING: "false"
    networks:
      - reverseproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      io.vidocq.environment: production
      io.vidocq.component: docs

networks:
  reverseproxy:
    external: true
    name: reverseproxy_default
