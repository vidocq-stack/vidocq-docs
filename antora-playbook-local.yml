site:
  title: Vidocq
  start_page: home-fr::index.adoc
  url: https://staging-doc.vidocq.dev

# LAYOUT INVARIANT — this checkout must sit one level below <workspace>/vidocq-docs,
# i.e. at the same depth as main/.
#
# The content sources below reach the sibling repos by relative path
# (`../../<repo>/main`), which is correct only at that depth. Worktrees are
# allowed, but their directory name must be flat: vidocq-docs/fix-foo/, never
# vidocq-docs/fix/foo/ — a slashed branch name would nest one level deeper and
# every path here would silently resolve to nothing. `mani run wt-add` flattens
# the name automatically (project tag 'flat-worktree'), and `npm run build`
# asserts the invariant via scripts/check-local-layout.sh. See the workspace
# docs/working-with-mani-and-worktrees.md, section "Exemptions".
content:
  sources:
    - url: ../../vidocq/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../vauban/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../ravel/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../cassini/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../champollion/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../chappe/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../foy/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../mansart/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../knock/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../humboldt/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../grimm/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../dirac/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../heisenberg/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../cervantes/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: ../../cyrano/main
      branches: HEAD
      worktrees: HEAD
      start_paths: [docs/en, docs/fr]
    - url: .
      branches: HEAD
      worktrees: HEAD
      start_paths: [content/home-en, content/home-fr]

ui:
  bundle:
    url: ./ui-bundle/build/ui-bundle.zip
    snapshot: true

asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    source-highlighter: highlight.js
    chappe-version: '@'
    primary-language: fr

    # --- Kroki ---
    # En local : pointe vers le Kroki self-hosted (kroki.vidocq.dev). En cas de
    # panne ou de dev offline, override : `npx antora --attribute kroki-server-url=…`.
    # `kroki-fetch-diagram: false` → blocs convertis en <img src="kroki.vidocq.dev/…">,
    # rendu paresseux côté navigateur — le build local reste rapide et ne bloque
    # pas si Kroki est inaccessible. (En prod, true côté antora-playbook.yml.)
    kroki-server-url: https://kroki.vidocq.dev
    kroki-fetch-diagram: false
    kroki-default-format: svg

    # --- URLs des repos ---
    repo-chappe: 'https://codeberg.org/Vidocq/chappe'
    repo-vauban: 'https://codeberg.org/Vidocq/vauban'
    repo-champollion: 'https://codeberg.org/Vidocq/champollion'
    repo-foy: 'https://codeberg.org/Vidocq/foy'
    repo-cassini: 'https://codeberg.org/Vidocq/cassini'
    repo-mansart: 'https://codeberg.org/Vidocq/mansart'
    repo-ravel: 'https://codeberg.org/Vidocq/ravel'
    repo-vidocq: 'https://codeberg.org/Vidocq/vidocq'
    repo-knock: 'https://codeberg.org/Vidocq/knock'
    repo-humboldt: 'https://codeberg.org/Vidocq/humboldt'
    repo-grimm: 'https://codeberg.org/Vidocq/grimm'
    repo-dirac: 'https://codeberg.org/Vidocq/dirac'
    repo-heisenberg: 'https://codeberg.org/Vidocq/heisenberg'
    repo-cervantes: 'https://codeberg.org/Vidocq/cervantes'
    repo-cyrano: 'https://codeberg.org/Vidocq/cyrano'

    # --- URLs des specs Jakarta / MicroProfile ---
    spec-rest-4: 'https://jakarta.ee/specifications/restful-ws/4.0/'
    spec-servlet-6-1: 'https://jakarta.ee/specifications/servlet/6.1/'
    spec-jsonp-2-1: 'https://jakarta.ee/specifications/jsonp/2.1/'
    spec-jsonb-3-0: 'https://jakarta.ee/specifications/jsonb/3.0/'
    spec-cdi-4-1: 'https://jakarta.ee/specifications/cdi/4.1/'
    spec-data-1: 'https://jakarta.ee/specifications/data/1.0/'
    spec-jpa-3-2: 'https://jakarta.ee/specifications/persistence/3.2/'
    spec-mp-config: 'https://microprofile.io/specifications/microprofile-config/'
    spec-mp-health: 'https://microprofile.io/specifications/microprofile-health/'
    spec-mp-metrics: 'https://microprofile.io/specifications/microprofile-metrics/'
    spec-mp-openapi: 'https://microprofile.io/specifications/microprofile-open-api/'

    # --- Bases d'URLs supplémentaires ---
    url-jep: 'https://openjdk.org/jeps'
    url-jakarta: 'https://jakarta.ee'
