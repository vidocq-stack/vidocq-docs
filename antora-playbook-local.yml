site:
  title: Vidocq
  start_page: home::index.adoc
  url: https://staging-doc.vidocq.dev

urls:
  latest_version_segment: ''
  latest_version_segment_strategy: redirect:from
  redirect_facility: netlify

antora:
  extensions:
    - '@antora/lunr-extension'

# Local build: sources are the sibling clones of the workspace
# (/Users/.../vidocq/<repo>, vidocq-docs being one of them). Antora reads the
# `main` and `docs/0.2.0` refs from each local .git; when a repo has `main`
# checked out, the working tree (including uncommitted changes) is used for it,
# which is exactly what you want to preview docs edits.

content:
  sources:
    - url: ../vidocq
      branches: [docs/0.4.0-RC2, docs/0.3.0]
      start_paths: [docs/en]
    # The released docs of the bricks: each docs-archive/<version> branch of the monorepo holds <brick>/docs/en of
    # every brick's docs/<version> (their former repositories were deleted). Fetch them into the local clone first.
    - url: ../vidocq
      branches: [docs-archive/0.4.0-RC2, docs-archive/0.3.0]
      start_paths: [vauban/docs/en, ravel/docs/en, cassini/docs/en, champollion/docs/en, chappe/docs/en, foy/docs/en,
                    mansart/docs/en, knock/docs/en, humboldt/docs/en, grimm/docs/en, dirac/docs/en, heisenberg/docs/en,
                    cervantes/docs/en, cyrano/docs/en]
    # ibarra and peano were first released with 0.4.0-RC1.
    - url: ../vidocq
      branches: [docs-archive/0.4.0-RC2]
      start_paths: [ibarra/docs/en, peano/docs/en]
    # erasmus has never been released: dev docs only.
    - url: ../erasmus
      branches: [main]
      start_paths: [docs/en]
    - url: ../tassis
      branches: [main]
      start_paths: [docs/en]
    # Every component but erasmus and tassis lives in the monorepo since 2026-11-19: its dev docs (main) come from
    # its folder there; its released docs come from the docs-archive branches above.
    - url: ../vidocq
      branches: [main]
      start_paths:
        - vidocq-runtime/docs/en
        - vidocq-components/vidocq-components-transport/chappe/docs/en
        - vidocq-components/vidocq-components-jakartaee/vidocq-components-jakartaee-core/vauban/docs/en
        - vidocq-components/vidocq-components-jakartaee/vidocq-components-jakartaee-core/champollion/docs/en
        - vidocq-components/vidocq-components-jakartaee/vidocq-components-jakartaee-core/cassini/docs/en
        - vidocq-components/vidocq-components-jakartaee/vidocq-components-jakartaee-webprofile/foy/docs/en
        - vidocq-components/vidocq-components-jakartaee/vidocq-components-jakartaee-webprofile/peano/docs/en
        - vidocq-components/vidocq-components-jakartaee/vidocq-components-jakartaee-webprofile/ibarra/docs/en
        - vidocq-components/vidocq-components-jakartaee/vidocq-components-jakartaee-webprofile/mansart/docs/en
        - vidocq-components/vidocq-components-microprofile/ravel/docs/en
        - vidocq-components/vidocq-components-microprofile/knock/docs/en
        - vidocq-components/vidocq-components-microprofile/dirac/docs/en
        - vidocq-components/vidocq-components-microprofile/heisenberg/docs/en
        - vidocq-components/vidocq-components-microprofile/cervantes/docs/en
        - vidocq-components/vidocq-components-microprofile/cyrano/docs/en
        - vidocq-components/vidocq-components-microprofile/humboldt/docs/en
        - vidocq-components/vidocq-components-microprofile/grimm/docs/en
        - preview/vidocq-components-jakartaee/vidocq-components-jakartaee-webprofile/noether/docs/en
        - preview/vidocq-components-jakartaee/vidocq-components-jakartaee-webprofile/kerckhoffs/docs/en
    - url: .
      branches: HEAD
      start_paths: [content/home]
    # tutorials is versioned like the bricks: HEAD (dev) + the release branches
    # of THIS repo (content/tutorials only differs between them).
    - url: .
      branches: [HEAD, docs/0.4.0-RC2, docs/0.3.0]
      start_paths: [content/tutorials]

ui:
  bundle:
    url: ./ui-bundle/build/ui-bundle.zip
    snapshot: true

asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    source-highlighter: highlight.js
    chappe-version: '@'

    # Local builds default to the public Kroki mirror so a build works without
    # the Foix VPN; override with --attribute kroki-server-url=... if needed.
    kroki-server-url: https://kroki.vidocq.dev
    kroki-fetch-diagram: true
    kroki-default-format: svg

    repo-chappe: 'https://codefloe.com/Vidocq/chappe'
    repo-vauban: 'https://codefloe.com/Vidocq/vauban'
    repo-champollion: 'https://codefloe.com/Vidocq/champollion'
    repo-foy: 'https://codefloe.com/Vidocq/foy'
    repo-cassini: 'https://codefloe.com/Vidocq/cassini'
    repo-mansart: 'https://codefloe.com/Vidocq/mansart'
    repo-ravel: 'https://codefloe.com/Vidocq/ravel'
    repo-vidocq: 'https://codefloe.com/Vidocq/vidocq'
    repo-knock: 'https://codefloe.com/Vidocq/knock'
    repo-humboldt: 'https://codefloe.com/Vidocq/humboldt'
    repo-grimm: 'https://codefloe.com/Vidocq/grimm'
    repo-cervantes: 'https://codefloe.com/Vidocq/cervantes'
    repo-cyrano: 'https://codefloe.com/Vidocq/cyrano'
    repo-dirac: 'https://codefloe.com/Vidocq/dirac'
    repo-heisenberg: 'https://codefloe.com/Vidocq/heisenberg'
    repo-erasmus: 'https://codefloe.com/Vidocq/erasmus'
    repo-ibarra: 'https://codefloe.com/Vidocq/ibarra'
    repo-peano: 'https://codefloe.com/Vidocq/peano'
    repo-noether: 'https://codefloe.com/Vidocq/noether'
    repo-tassis: 'https://codefloe.com/Vidocq/tassis'
    repo-kerckhoffs: 'https://codefloe.com/Vidocq/kerckhoffs'

    spec-rest-4: 'https://jakarta.ee/specifications/restful-ws/4.0/'
    spec-servlet-6-1: 'https://jakarta.ee/specifications/servlet/6.1/'
    spec-jsonp-2-1: 'https://jakarta.ee/specifications/jsonp/2.1/'
    spec-jsonb-3-0: 'https://jakarta.ee/specifications/jsonb/3.0/'
    spec-cdi-4-1: 'https://jakarta.ee/specifications/cdi/4.1/'
    spec-data-1: 'https://jakarta.ee/specifications/data/1.0/'
    spec-jpa-3-2: 'https://jakarta.ee/specifications/persistence/3.2/'
    spec-validation-3-1: 'https://jakarta.ee/specifications/bean-validation/3.1/'
    spec-mp-config: 'https://microprofile.io/specifications/microprofile-config/'
    spec-mp-health: 'https://microprofile.io/specifications/microprofile-health/'
    spec-mp-metrics: 'https://microprofile.io/specifications/microprofile-metrics/'
    spec-mp-openapi: 'https://microprofile.io/specifications/microprofile-open-api/'
    spec-mp-jwt: 'https://microprofile.io/specifications/microprofile-jwt-auth/'
    spec-mp-rest-client: 'https://microprofile.io/specifications/microprofile-rest-client/'
    spec-mp-fault-tolerance: 'https://microprofile.io/specifications/microprofile-fault-tolerance/'
    spec-mp-telemetry: 'https://microprofile.io/specifications/microprofile-telemetry/'

    url-jep: 'https://openjdk.org/jeps'
    url-jakarta: 'https://jakarta.ee'
