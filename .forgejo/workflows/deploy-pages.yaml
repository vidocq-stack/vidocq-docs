name: Deploy to Cloudflare Pages

# Publication de la documentation Antora sur Cloudflare Pages (doc.vidocq.dev).
# Calqué sur le workflow `deploy-pages.yaml` du projet `pages` (site ROQ), adapté
# à la chaîne Antora : build du UI bundle, build du site prod, puis `wrangler pages
# deploy`.
#
# Secrets requis (Forgejo → Settings → Secrets) :
#   CF_API_TOKEN   : token Cloudflare avec la permission « Cloudflare Pages: Edit »
#   CF_ACCOUNT_ID  : identifiant du compte Cloudflare
#
# Modèle de déploiement (identique au projet pages) :
#   push sur main        → déploiement de production (doc.vidocq.dev)
#   workflow_dispatch    → déploiement manuel de production
#   autres branches      → déploiement de prévisualisation (URL *.pages.dev)

on:
  push:
    # docs/* included: the versioned tutorials component builds from this
    # repo's own docs/<version> branches, so a fix cherry-picked there must
    # redeploy too (the build itself always runs from main — see checkout).
    branches: [main, 'docs/*']
  workflow_dispatch:
    inputs:
      reason:
        description: "Raison du déploiement manuel (optionnel)"
        required: false
        default: "manual"

# Serialize deploys: notify-docs bursts (several repos pushing at once) used to
# race — an older wrangler upload could land after a newer one and serve stale
# content. One deploy at a time, keeping only the latest pending run.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: docker
    # Le label `docker` du runner Forgejo mappe par défaut sur `docker:dind`
    # (alpine, sans Node). On surcharge avec `catthehacker/ubuntu:act-22.04`
    # (Node 20 + bash). Aucun démon Docker n'est requis
    # ici : le déploiement Cloudflare passe uniquement par wrangler (HTTPS).
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always build the site from main, even when triggered by a push on
          # a docs/* branch (that content is pulled in by the playbook).
          ref: main

      - name: Fetch this repo's docs/* branches (versioned tutorials source)
        run: git fetch --no-tags origin '+refs/heads/docs/*:refs/heads/docs/*'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Fetch Chappe version (for the UI bundle footer)
        run: node scripts/fetch-chappe-version.js

      - name: Build UI bundle
        working-directory: ui-bundle
        run: |
          npm ci
          npm run build

      - name: Install Antora deps (root)
        run: npm ci --no-audit --no-fund

      - name: Build Antora site (production)
        # Playbook de prod : url https://doc.vidocq.dev, sources clonées en HTTPS
        # depuis Codeberg. SITE_URL / KROKI_SERVER_URL surchargent si définis.
        # --fetch est indispensable : sur un runner persistant, le cache Antora
        # (~/.cache/antora) réutilise les clones existants SANS les rafraîchir —
        # le site se redéploierait avec les docs d'un main périmé.
        run: |
          ./node_modules/.bin/antora \
            --fetch \
            --url "${SITE_URL:-https://doc.vidocq.dev}" \
            --attribute kroki-server-url="${KROKI_SERVER_URL:-https://kroki.vidocq.dev}" \
            antora-playbook.yml
          # Cloudflare Pages cache policy (must-revalidate) + legacy-URL
          # redirects (segment-less pages -> released version, page by page).
          cp _headers build/site/_headers
          node scripts/gen-redirects.js

      - name: Create Cloudflare Pages project (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler@latest pages project create vidocq-docs --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          TRIGGER="${{ github.event_name }}"
          NOTE="${{ github.event.inputs.reason }}"
          MSG="ci: deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) [${TRIGGER}${NOTE:+ — $NOTE}]"
          npx wrangler@latest pages deploy build/site \
            --project-name=vidocq-docs \
            --branch="$BRANCH" \
            --commit-message="$MSG"

      - name: Notify Slack on success
        if: success()
        uses: https://codefloe.com/Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: success
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          sha: ${{ github.sha }}
          commit-message: ${{ github.event.head_commit.message }}
          commit-author: ${{ github.event.head_commit.author.name }}

      - name: Notify Slack on failure
        if: failure()
        uses: https://codefloe.com/Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
