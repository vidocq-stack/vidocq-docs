name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    # Le label `docker` du runner Forgejo mappe par défaut sur `docker:dind`
    # (alpine, pas de Node). On surcharge avec `catthehacker/ubuntu:act-22.04`
    # (Node 20 + Docker CLI + bash). DOCKER_HOST est détecté dynamiquement
    # par l'étape `Detect Docker daemon` ci-dessous : le job tourne DANS le
    # sidecar dind (pas sur l'hôte), donc le démon Docker lui est joignable
    # via le gateway de son bridge interne (typiquement 172.17.0.1).
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Plus de checkout du repo frère vidocq/chappe : le Dockerfile pull
        # désormais le fat-jar `chappe-cli-shaded` depuis repolite (cf. ADR-0003).

      - name: Detect Docker daemon (DinD gateway)
        # Le job tourne dans le dind. Le démon Docker est le dind lui-même,
        # accessible via le gateway de son bridge interne (route default).
        # `iproute2` (commande `ip`) n'est pas dans l'image catthehacker:act,
        # donc on parse /proc/net/route à la main.
        # Format : la route default a Destination=00000000, Gateway en hex
        # little-endian (ex. 010011AC = 0xAC 0x11 0x00 0x01 = 172.17.0.1).
        run: |
          set -e
          GW_HEX=$(awk '$2 == "00000000" { print $3; exit }' /proc/net/route 2>/dev/null || true)
          if [ -n "$GW_HEX" ] && [ "${#GW_HEX}" -ge 8 ]; then
            GW=$(printf "%d.%d.%d.%d\n" \
              "0x${GW_HEX:6:2}" \
              "0x${GW_HEX:4:2}" \
              "0x${GW_HEX:2:2}" \
              "0x${GW_HEX:0:2}")
          else
            GW=172.17.0.1   # fallback Docker bridge default
          fi
          echo "DinD gateway: $GW"
          if ! timeout 5 bash -c "</dev/tcp/$GW/2375"; then
            echo "::error::Docker daemon at tcp://$GW:2375 unreachable"
            exit 1
          fi
          echo "DOCKER_HOST=tcp://$GW:2375" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Fetch Chappe version (pour le footer du UI bundle)
        run: node scripts/fetch-chappe-version.js

      - name: Build UI bundle
        working-directory: ui-bundle
        run: |
          npm ci
          npm run build

      - name: Configure git credentials for Antora
        # Antora ne supporte pas ssh:// — il pull les sources en https.
        # Si les repos vidocq/* sont privés (ou même publics avec rate-limit
        # anonyme), Antora a besoin d'un fichier ~/.git-credentials.
        run: |
          git config --global credential.helper store
          echo "https://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_TOKEN }}@forge.vidocq.dev" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Install Antora deps (root)
        # Installe Antora CLI + asciidoctor-kroki (cf. package.json racine).
        # Avant : `npx --yes antora@^3.1.0` était utilisé seul, mais il ne
        # résout pas les extensions AsciiDoc déclarées dans le playbook
        # (asciidoctor-kroki) → FATAL "Cannot find module 'asciidoctor-kroki'".
        run: npm ci --no-audit --no-fund

      - name: Build Antora site
        run: ./node_modules/.bin/antora antora-playbook.yml

      - name: Login to Forgejo registry
        # Forgejo Actions interdit le préfixe FORGEJO_ sur les secrets utilisateur :
        # on utilise REGISTRY_USER / REGISTRY_TOKEN (cf. README, section Déploiement).
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forge.vidocq.dev -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Compute tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "tag=snapshot-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "extra=snapshot" >> "$GITHUB_OUTPUT"
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "extra=latest" >> "$GITHUB_OUTPUT"
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ref-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "channel=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push image
        # Build args :
        #   CHAPPE_VERSION : version Chappe à tirer depuis repolite
        #   MAVEN_REPO_URL : par défaut https://repo.vidocq.dev/snapshots
        # Secret BuildKit `mavensettings` :
        #   monté en /root/.m2/settings.xml uniquement pour `RUN mvn` ;
        #   les creds n'apparaissent dans aucune couche de l'image finale.
        run: |
          set -eu
          IMG=forge.vidocq.dev/vidocq/vidocq-docs

          # Génère le settings.xml temporaire (creds repolite).
          SETTINGS_FILE=$(mktemp)
          cat > "$SETTINGS_FILE" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>vidocq-repolite</id>
                <username>__USER__</username>
                <password>__TOKEN__</password>
              </server>
            </servers>
          </settings>
          XML
          # Le heredoc est quoted pour empêcher l'expansion shell des chevrons,
          # on substitue ensuite les placeholders.
          sed -i "s|__USER__|${{ secrets.MAVEN_REPO_USER }}|; s|__TOKEN__|${{ secrets.MAVEN_REPO_TOKEN }}|" "$SETTINGS_FILE"
          chmod 600 "$SETTINGS_FILE"
          trap 'rm -f "$SETTINGS_FILE"' EXIT

          docker build \
            --secret "id=mavensettings,src=$SETTINGS_FILE" \
            --build-arg CHAPPE_VERSION="${CHAPPE_VERSION:-0.1.0-SNAPSHOT}" \
            --build-arg MAVEN_REPO_URL="${MAVEN_REPO_URL:-https://repo.vidocq.dev/snapshots}" \
            -t "$IMG:${{ steps.tags.outputs.tag }}" \
            $( [ -n "${{ steps.tags.outputs.extra }}" ] && echo "-t $IMG:${{ steps.tags.outputs.extra }}" ) \
            .
          docker push "$IMG:${{ steps.tags.outputs.tag }}"
          if [ -n "${{ steps.tags.outputs.extra }}" ]; then
            docker push "$IMG:${{ steps.tags.outputs.extra }}"
          fi

      - name: Trigger Portainer redeploy (staging)
        if: steps.tags.outputs.channel == 'staging'
        run: curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_STAGING }}"

      - name: Trigger Portainer redeploy (prod)
        if: steps.tags.outputs.channel == 'prod'
        run: curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_PROD }}"
