name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    # Le label `docker` du runner Forgejo mappe par défaut sur `docker:dind`
    # (alpine, pas de Node). On surcharge avec `catthehacker/ubuntu:act-22.04`
    # (Node 20 + Docker CLI + bash). DOCKER_HOST est détecté dynamiquement
    # par l'étape `Detect Docker daemon` ci-dessous : le job tourne DANS le
    # sidecar dind (pas sur l'hôte), donc le démon Docker lui est joignable
    # via le gateway de son bridge interne (typiquement 172.17.0.1).
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No sibling vidocq/chappe checkout: the Dockerfile pulls the
        # `chappe-cli-shaded` fat-jar from the public Central Portal snapshots
        # (cf. ADR-0003).

      - name: Detect Docker daemon (DinD gateway)
        # Le job tourne dans le dind. Le démon Docker est le dind lui-même,
        # accessible via le gateway de son bridge interne (route default).
        # `iproute2` (commande `ip`) n'est pas dans l'image catthehacker:act,
        # donc on parse /proc/net/route à la main.
        # Format : la route default a Destination=00000000, Gateway en hex
        # little-endian (ex. 010011AC = 0xAC 0x11 0x00 0x01 = 172.17.0.1).
        run: |
          set -e
          GW_HEX=$(awk '$2 == "00000000" { print $3; exit }' /proc/net/route 2>/dev/null || true)
          if [ -n "$GW_HEX" ] && [ "${#GW_HEX}" -ge 8 ]; then
            GW=$(printf "%d.%d.%d.%d\n" \
              "0x${GW_HEX:6:2}" \
              "0x${GW_HEX:4:2}" \
              "0x${GW_HEX:2:2}" \
              "0x${GW_HEX:0:2}")
          else
            GW=172.17.0.1   # fallback Docker bridge default
          fi
          echo "DinD gateway: $GW"
          if ! timeout 5 bash -c "</dev/tcp/$GW/2375"; then
            echo "::error::Docker daemon at tcp://$GW:2375 unreachable"
            exit 1
          fi
          echo "DOCKER_HOST=tcp://$GW:2375" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Fetch Chappe version (for the UI bundle footer)
        run: node scripts/fetch-chappe-version.js

      - name: Build UI bundle
        working-directory: ui-bundle
        run: |
          npm ci
          npm run build

      - name: Install Antora deps (root)
        # Installe Antora CLI + asciidoctor-kroki (cf. package.json racine).
        # Avant : `npx --yes antora@^3.1.0` était utilisé seul, mais il ne
        # résout pas les extensions AsciiDoc déclarées dans le playbook
        # (asciidoctor-kroki) → FATAL "Cannot find module 'asciidoctor-kroki'".
        run: npm ci --no-audit --no-fund

      - name: Build Antora site
        # Single public environment: doc.vidocq.dev. SITE_URL overrides if set.
        # kroki-server-url defaults to the self-hosted kroki.vidocq.dev (Foix),
        # overridable via the KROKI_SERVER_URL env.
        run: ./node_modules/.bin/antora --url "${SITE_URL:-https://doc.vidocq.dev}" --attribute kroki-server-url="${KROKI_SERVER_URL:-https://kroki.vidocq.dev}" antora-playbook.yml

      - name: Login to container registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.vidocq.dev -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Compute tags
        id: tags
        # Mutable tags only, so the self-cleaning registry GC works:
        #   main  -> snapshot
        #   v*    -> <version> + latest
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "tag=snapshot" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "extra=latest" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=snapshot" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push image
        # The Dockerfile pulls chappe-cli anonymously from the public Central
        # Portal snapshots: no Maven credentials, no BuildKit mavensettings secret.
        # Build args:
        #   CHAPPE_VERSION : Chappe version to pull from Central snapshots
        #   MAVEN_REPO_URL : public Central Portal snapshots repository
        #   CHAPPE_PULL_NONCE : invalidates the dependency:copy layer each run
        run: |
          set -eu
          IMG=registry.vidocq.dev/vidocq-docs

          docker build \
            --build-arg CHAPPE_VERSION=0.1.0-SNAPSHOT \
            --build-arg MAVEN_REPO_URL=https://central.sonatype.com/repository/maven-snapshots \
            --build-arg CHAPPE_PULL_NONCE="$(date +%s)-${GITHUB_SHA::7}" \
            -t "$IMG:${{ steps.tags.outputs.tag }}" \
            $( [ -n "${{ steps.tags.outputs.extra }}" ] && echo "-t $IMG:${{ steps.tags.outputs.extra }}" ) \
            .
          docker push "$IMG:${{ steps.tags.outputs.tag }}"
          if [ -n "${{ steps.tags.outputs.extra }}" ]; then
            docker push "$IMG:${{ steps.tags.outputs.extra }}"
          fi

      - name: Redeploy docs stack on Foix Portainer
        # Git-backed stack redeploy via the Portainer API. `?pullImage=true`
        # forces a docker pull (mutable tags), then recreates the container.
        # Only runs on push to main and on v* tags.
        if: steps.tags.outputs.deploy == 'true'
        run: |
          set -eu
          BASE="${{ secrets.FOIX_PORTAINER_URL }}"; BASE="${BASE%/}"
          curl -fsSL --retry 3 -X POST \
            -H "X-API-Key: ${{ secrets.FOIX_PORTAINER_TOKEN }}" \
            "${BASE}/api/stacks/${{ secrets.FOIX_PORTAINER_DOCS_STACK_ID }}/git/redeploy?pullImage=true"
