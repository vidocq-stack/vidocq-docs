site:
  title: Vidocq
  start_page: home-fr::index.adoc
  url: https://doc.vidocq.dev

# Antora ne supporte que http(s) ou des chemins filesystem — pas ssh://.
# Pour des repos privés, le workflow CI (et le build local) doit avoir un
# `~/.git-credentials` rempli :
#   echo "https://<user>:<token>@forge.vidocq.dev" > ~/.git-credentials
#   git config --global credential.helper store
# Antora lit automatiquement ce fichier (helper Git standard).

content:
  sources:
    - url: https://forge.vidocq.dev/vidocq/vidocq.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://forge.vidocq.dev/vidocq/vauban.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://forge.vidocq.dev/vidocq/ravel.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://forge.vidocq.dev/vidocq/cassini.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://forge.vidocq.dev/vidocq/champollion.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://forge.vidocq.dev/vidocq/chappe.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://forge.vidocq.dev/vidocq/foy.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://forge.vidocq.dev/vidocq/mansart.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: .
      branches: HEAD
      start_paths: [content/home-en, content/home-fr]

# Quand les premières releases sortent, ajouter aux branches : tags: ['v*']

ui:
  bundle:
    url: ./ui-bundle/build/ui-bundle.zip
    snapshot: true

asciidoc:
  extensions:
    # Diagrammes mermaid / plantuml / etc. via Kroki public.
    # `kroki-fetch-diagram: true` télécharge les SVG au build → aucune dépendance
    # runtime à kroki.io ; le site servi par Chappe est 100 % statique.
    - asciidoctor-kroki
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    source-highlighter: highlight.js
    chappe-version: '@'
    primary-language: fr

    # --- Kroki ---
    # Self-hosted par défaut (déploiement décrit dans deploy/compose.kroki.yml,
    # exposé via NPM en kroki.vidocq.dev). kroki.io public reste utilisable en
    # secours via : `npx antora --attribute kroki-server-url=https://kroki.io …`.
    # `kroki-fetch-diagram: true` télécharge les SVG au build → site servi par
    # Chappe = 100 % statique, aucune dépendance runtime à kroki.
    kroki-server-url: https://kroki.vidocq.dev
    kroki-fetch-diagram: true
    kroki-default-format: svg

    # --- URLs des repos (centralises : changer ici, pas dans les modules) ---
    repo-chappe: 'https://forge.vidocq.dev/vidocq/chappe'
    repo-vauban: 'https://forge.vidocq.dev/vidocq/vauban'
    repo-champollion: 'https://forge.vidocq.dev/vidocq/champollion'
    repo-foy: 'https://forge.vidocq.dev/vidocq/foy'
    repo-cassini: 'https://forge.vidocq.dev/vidocq/cassini'
    repo-mansart: 'https://forge.vidocq.dev/vidocq/mansart'
    repo-ravel: 'https://forge.vidocq.dev/vidocq/ravel'
    repo-vidocq: 'https://forge.vidocq.dev/vidocq/vidocq'

    # --- URLs des specs Jakarta / MicroProfile (canoniques jakarta.ee) ---
    spec-rest-4: 'https://jakarta.ee/specifications/restful-ws/4.0/'
    spec-servlet-6-1: 'https://jakarta.ee/specifications/servlet/6.1/'
    spec-jsonp-2-1: 'https://jakarta.ee/specifications/jsonp/2.1/'
    spec-jsonb-3-0: 'https://jakarta.ee/specifications/jsonb/3.0/'
    spec-cdi-4-1: 'https://jakarta.ee/specifications/cdi/4.1/'
    spec-data-1: 'https://jakarta.ee/specifications/data/1.0/'
    spec-jpa-3-2: 'https://jakarta.ee/specifications/persistence/3.2/'
    spec-mp-config: 'https://microprofile.io/specifications/microprofile-config/'
    spec-mp-health: 'https://microprofile.io/specifications/microprofile-health/'
    spec-mp-metrics: 'https://microprofile.io/specifications/microprofile-metrics/'
    spec-mp-openapi: 'https://microprofile.io/specifications/microprofile-open-api/'

    # --- Bases d'URLs supplémentaires ---
    url-jep: 'https://openjdk.org/jeps'
    url-jakarta: 'https://jakarta.ee'
