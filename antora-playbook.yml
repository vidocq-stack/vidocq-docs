site:
  title: Vidocq
  start_page: home-fr::index.adoc
  url: https://doc.vidocq.dev

# Antora ne supporte que http(s) ou des chemins filesystem — pas ssh://.
# Les sources sont des repos PUBLICS sur Codeberg (org Vidocq) : Antora les
# clone en HTTPS anonyme, aucun `~/.git-credentials` n'est nécessaire.

content:
  sources:
    - url: https://codeberg.org/Vidocq/vidocq.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/vauban.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/ravel.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/cassini.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/champollion.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/chappe.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/foy.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/mansart.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/knock.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/humboldt.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/grimm.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/dirac.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/heisenberg.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/cervantes.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: https://codeberg.org/Vidocq/cyrano.git
      branches: [main]
      start_paths: [docs/en, docs/fr]
    - url: .
      branches: HEAD
      start_paths: [content/home-en, content/home-fr]

# Quand les premières releases sortent, ajouter aux branches : tags: ['v*']

ui:
  bundle:
    url: ./ui-bundle/build/ui-bundle.zip
    snapshot: true

asciidoc:
  extensions:
    # Diagrammes mermaid / plantuml / etc. via Kroki public.
    # `kroki-fetch-diagram: true` télécharge les SVG au build → aucune dépendance
    # runtime à kroki.io ; le site servi par Chappe est 100 % statique.
    - asciidoctor-kroki
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    source-highlighter: highlight.js
    chappe-version: '@'
    primary-language: fr

    # --- Kroki ---
    # Kroki self-hosted (Foix) par défaut. Overridable via :
    # `npx antora --attribute kroki-server-url=https://kroki.example …`.
    # `kroki-fetch-diagram: true` télécharge les SVG au build → site servi par
    # Chappe = 100 % statique, aucune dépendance runtime à kroki.
    kroki-server-url: https://kroki.vidocq.dev
    kroki-fetch-diagram: true
    kroki-default-format: svg

    # --- URLs des repos (centralises : changer ici, pas dans les modules) ---
    repo-chappe: 'https://codeberg.org/Vidocq/chappe'
    repo-vauban: 'https://codeberg.org/Vidocq/vauban'
    repo-champollion: 'https://codeberg.org/Vidocq/champollion'
    repo-foy: 'https://codeberg.org/Vidocq/foy'
    repo-cassini: 'https://codeberg.org/Vidocq/cassini'
    repo-mansart: 'https://codeberg.org/Vidocq/mansart'
    repo-ravel: 'https://codeberg.org/Vidocq/ravel'
    repo-vidocq: 'https://codeberg.org/Vidocq/vidocq'
    repo-knock: 'https://codeberg.org/Vidocq/knock'
    repo-humboldt: 'https://codeberg.org/Vidocq/humboldt'
    repo-grimm: 'https://codeberg.org/Vidocq/grimm'
    repo-cervantes: 'https://codeberg.org/Vidocq/cervantes'
    repo-cyrano: 'https://codeberg.org/Vidocq/cyrano'
    repo-dirac: 'https://codeberg.org/Vidocq/dirac'
    repo-heisenberg: 'https://codeberg.org/Vidocq/heisenberg'

    # --- URLs des specs Jakarta / MicroProfile (canoniques jakarta.ee) ---
    spec-rest-4: 'https://jakarta.ee/specifications/restful-ws/4.0/'
    spec-servlet-6-1: 'https://jakarta.ee/specifications/servlet/6.1/'
    spec-jsonp-2-1: 'https://jakarta.ee/specifications/jsonp/2.1/'
    spec-jsonb-3-0: 'https://jakarta.ee/specifications/jsonb/3.0/'
    spec-cdi-4-1: 'https://jakarta.ee/specifications/cdi/4.1/'
    spec-data-1: 'https://jakarta.ee/specifications/data/1.0/'
    spec-jpa-3-2: 'https://jakarta.ee/specifications/persistence/3.2/'
    spec-mp-config: 'https://microprofile.io/specifications/microprofile-config/'
    spec-mp-health: 'https://microprofile.io/specifications/microprofile-health/'
    spec-mp-metrics: 'https://microprofile.io/specifications/microprofile-metrics/'
    spec-mp-openapi: 'https://microprofile.io/specifications/microprofile-open-api/'
    spec-mp-jwt: 'https://microprofile.io/specifications/microprofile-jwt-auth/'
    spec-mp-rest-client: 'https://microprofile.io/specifications/microprofile-rest-client/'
    spec-mp-fault-tolerance: 'https://microprofile.io/specifications/microprofile-fault-tolerance/'
    spec-mp-telemetry: 'https://microprofile.io/specifications/microprofile-telemetry/'

    # --- Bases d'URLs supplémentaires ---
    url-jep: 'https://openjdk.org/jeps'
    url-jakarta: 'https://jakarta.ee'
