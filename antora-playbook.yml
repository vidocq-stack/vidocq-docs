site:
  title: Vidocq
  start_page: home::index.adoc
  url: https://doc.vidocq.dev

urls:
  # Every page is published under its version segment (/<component>/0.2.0/,
  # /<component>/dev/) so the version is always visible in the URL. The
  # pre-versioning URLs (no segment) 301-redirect to the released version via
  # the Cloudflare Pages _redirects file (netlify format).
  latest_version_segment: ''
  latest_version_segment_strategy: redirect:from
  redirect_facility: netlify

antora:
  extensions:
    # Client-side full-text search: static Lunr index generated at build time,
    # no external service involved.
    - '@antora/lunr-extension'

# Antora only supports http(s) or filesystem paths -- not ssh://.
# Sources are PUBLIC repos on Codefloe (Vidocq org): Antora clones them over
# anonymous HTTPS, no ~/.git-credentials needed.
#
# Every released component is built twice: `main` carries the in-development
# docs (Antora version `dev`, prerelease) and `docs/0.2.0` carries the docs of
# the released 0.2.0 train (the default version shown on the site). On the next
# release train: create docs/<version> branches from main, bump antora.yml
# there, and add the branch below.

content:
  sources:
    - url: https://codefloe.com/Vidocq/vidocq.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/vauban.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/ravel.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/cassini.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/champollion.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/chappe.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/foy.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/mansart.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/knock.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/humboldt.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/grimm.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/dirac.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/heisenberg.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/cervantes.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    - url: https://codefloe.com/Vidocq/cyrano.git
      branches: [main, docs/0.2.0]
      start_paths: [docs/en]
    # erasmus has never been released: dev docs only.
    - url: https://codefloe.com/Vidocq/erasmus.git
      branches: [main]
      start_paths: [docs/en]
    - url: .
      branches: HEAD
      start_paths: [content/home]
    # tutorials is versioned like the bricks: HEAD (dev) + the release branches
    # of THIS repo (content/tutorials only differs between them).
    - url: .
      branches: [HEAD, docs/0.2.0]
      start_paths: [content/tutorials]

ui:
  bundle:
    url: ./ui-bundle/build/ui-bundle.zip
    snapshot: true

asciidoc:
  extensions:
    # Mermaid / plantuml / etc. diagrams via Kroki.
    # `kroki-fetch-diagram: true` downloads the SVGs at build time -> no runtime
    # dependency on kroki; the served site stays 100% static.
    - asciidoctor-kroki
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    source-highlighter: highlight.js
    chappe-version: '@'

    # --- Kroki ---
    # Self-hosted Kroki (Foix) by default. Overridable with:
    # `npx antora --attribute kroki-server-url=https://kroki.example ...`.
    kroki-server-url: https://kroki.vidocq.dev
    kroki-fetch-diagram: true
    kroki-default-format: svg

    # --- Repo URLs (centralized: change here, not in the modules) ---
    repo-chappe: 'https://codefloe.com/Vidocq/chappe'
    repo-vauban: 'https://codefloe.com/Vidocq/vauban'
    repo-champollion: 'https://codefloe.com/Vidocq/champollion'
    repo-foy: 'https://codefloe.com/Vidocq/foy'
    repo-cassini: 'https://codefloe.com/Vidocq/cassini'
    repo-mansart: 'https://codefloe.com/Vidocq/mansart'
    repo-ravel: 'https://codefloe.com/Vidocq/ravel'
    repo-vidocq: 'https://codefloe.com/Vidocq/vidocq'
    repo-knock: 'https://codefloe.com/Vidocq/knock'
    repo-humboldt: 'https://codefloe.com/Vidocq/humboldt'
    repo-grimm: 'https://codefloe.com/Vidocq/grimm'
    repo-cervantes: 'https://codefloe.com/Vidocq/cervantes'
    repo-cyrano: 'https://codefloe.com/Vidocq/cyrano'
    repo-dirac: 'https://codefloe.com/Vidocq/dirac'
    repo-heisenberg: 'https://codefloe.com/Vidocq/heisenberg'
    repo-erasmus: 'https://codefloe.com/Vidocq/erasmus'

    # --- Jakarta / MicroProfile spec URLs (canonical jakarta.ee) ---
    spec-rest-4: 'https://jakarta.ee/specifications/restful-ws/4.0/'
    spec-servlet-6-1: 'https://jakarta.ee/specifications/servlet/6.1/'
    spec-jsonp-2-1: 'https://jakarta.ee/specifications/jsonp/2.1/'
    spec-jsonb-3-0: 'https://jakarta.ee/specifications/jsonb/3.0/'
    spec-cdi-4-1: 'https://jakarta.ee/specifications/cdi/4.1/'
    spec-data-1: 'https://jakarta.ee/specifications/data/1.0/'
    spec-jpa-3-2: 'https://jakarta.ee/specifications/persistence/3.2/'
    spec-validation-3-1: 'https://jakarta.ee/specifications/bean-validation/3.1/'
    spec-mp-config: 'https://microprofile.io/specifications/microprofile-config/'
    spec-mp-health: 'https://microprofile.io/specifications/microprofile-health/'
    spec-mp-metrics: 'https://microprofile.io/specifications/microprofile-metrics/'
    spec-mp-openapi: 'https://microprofile.io/specifications/microprofile-open-api/'
    spec-mp-jwt: 'https://microprofile.io/specifications/microprofile-jwt-auth/'
    spec-mp-rest-client: 'https://microprofile.io/specifications/microprofile-rest-client/'
    spec-mp-fault-tolerance: 'https://microprofile.io/specifications/microprofile-fault-tolerance/'
    spec-mp-telemetry: 'https://microprofile.io/specifications/microprofile-telemetry/'

    # --- Extra URL bases ---
    url-jep: 'https://openjdk.org/jeps'
    url-jakarta: 'https://jakarta.ee'
